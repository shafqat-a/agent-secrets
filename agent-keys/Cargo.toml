[package]
name = "agent-secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
age = { version = "0.11", features = ["ssh"] }
directories = "5"
rpassword = "7"
zeroize = { version = "1.8", features = ["derive"] }
anyhow = "1.0"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
